<header class="global-header">
    
    <!-- Left Section: Logo & Brand -->
    <div class="header-left">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="#00a1e0">
            <path d="M17.5 7.5A4.5 4.5 0 0 0 9 6.5a3.5 3.5 0 0 0-6 2.5 3 3 0 0 0 3 3h11.5a3.5 3.5 0 0 0 0-7z"></path>
        </svg>
        <span class="brand-text">Community</span>
    </div>
    
    <!-- Center Section: Search Bar -->
    <div class="header-center">
        <div class="search-bar-container">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#747474" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" placeholder="Search...">
        </div>
    </div>
    
    <!-- Right Section: Notifications & Profile -->
    <div class="header-right">
        <div class="notification-icon">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="notification-badge">1</span>
        </div>
        <div class="user-profile">
            <div class="avatar-circle">JS</div>
            <span class="user-name">John Smith</span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#747474" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </div>
    </div>

</header>
